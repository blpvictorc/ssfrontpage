<script>
// =========================================================================
// SS Team 子頁面通用追蹤模組 (貼喺各個 Tool 嘅 </body> 前面)
// =========================================================================
const SS_TRACKER_CONFIG = {
    webhookUrl: "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE",
    toolName: document.title || window.location.pathname
};

// 1. 自動讀取 URL 傳過嚟或者同網域 localStorage 嘅 User Name
(function initSubPageTracker() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('user')) {
        localStorage.setItem('ss_current_user', params.get('user'));
    }
    // 記錄進入咗呢個子頁面
    trackToolFunction("Page_Loaded", "User opened tool page");
})();

// 2. 喺你想追蹤嘅 Function 入面隨時 Call 呢句！
function trackToolFunction(functionName, extraDetails = "") {
    const currentUser = localStorage.getItem('ss_current_user') || 'Unidentified_User';
    
    // 計算呢個 User 喺呢個 Tool 執行呢個 Function 嘅累積次數
    const countKey = `ss_fn_count_${SS_TRACKER_CONFIG.toolName}_${functionName}`;
    let runCount = parseInt(localStorage.getItem(countKey) || '0', 10) + 1;
    localStorage.setItem(countKey, runCount);

    const payload = {
        timestamp: new Date().toISOString(),
        user: currentUser,
        page: SS_TRACKER_CONFIG.toolName,
        action: functionName,
        runCount: runCount,
        details: extraDetails
    };

    console.log("[SS Function Tracker]", payload);

    if (!SS_TRACKER_CONFIG.webhookUrl || SS_TRACKER_CONFIG.webhookUrl.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        return;
    }

    fetch(SS_TRACKER_CONFIG.webhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
    }).catch(err => console.error("Tracker error:", err));
}
</script>
